const showKey=k=>info('Chave de recuperação',`<p>Guarde esta chave em um lugar seguro. Ela é a única forma de redefinir a senha sem apagar os dados, e não será mostrada de novo.</p><p style="font-size:22px;font-weight:700;letter-spacing:.06em;margin:16px 0">${k.match(/.{4}/g).join('-')}</p>`);
function doLogin(){const fm=$('#lf');if(!fm||!fm.reportValidity())return;const o=Object.fromEntries(new FormData(fm)),l=(o.login||'').trim();
if(!db.users.length){const u={id:U(),nome:o.nome,login:l,senha:hs(l,o.senha),perfil:'Mestre'};db.users.push(u);const k=mk();db.rk=hs('rk',k);save();me=u;route='folha';ui.lk='';draw();showKey(k);return}
else{const u=db.users.find(x=>x.login===l&&x.senha===hs(l,o.senha));if(!u){$('#er').textContent='Usuário ou senha incorretos.';return}me=u}
route='folha';ui.lk='';draw()}
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.target.tagName!=='INPUT')return;if(e.target.closest('#lf')){e.preventDefault();doLogin()}else if(e.target.closest('#frm')){e.preventDefault();doSave()}});
function saveFolha(f,status,extra){const c=calc(f,ui.lc),old=svd(f.id,ui.fc),x=Object.assign({id:old?old.id:U(),fid:f.id,emp:f.empresaId,comp:ui.fc,status:old?old.status:'Rascunho',em:new Date().toLocaleDateString('pt-BR'),por:me.nome,lanc:JSON.parse(JSON.stringify(ui.lc)),prov:c.P,desc:c.D,info:c.I,tp:c.prov,td:c.desc,liq:c.liq},old?{conf:old.conf,fech:old.fech}:{},extra||{});
if(status)x.status=status;const i=db.folhas.findIndex(y=>y.id===x.id);if(i>=0)db.folhas[i]=x;else db.folhas.push(x);save()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a],[data-r]');if(!t)return;const a=t.dataset.a,k=t.dataset.k,id=t.dataset.id;
if(t.dataset.r){route=t.dataset.r;ui.lk='';draw();return}
const f=db.funcionarios.find(x=>x.id===ui.ff),sv=f&&svd(f.id,ui.fc);
if(a==='x')dlg().close();
else if(a==='ok')doSave();
else if(a==='forgot'){if(!db.rk)info('Esqueci minha senha','<p>Este acesso foi criado sem chave de recuperação, então a senha não pode ser redefinida. A única alternativa é apagar todos os dados deste navegador e criar um novo usuário mestre.</p><button type="button" class="btn g" data-a="wipe">Apagar tudo e recomeçar</button>');
else openForm('Redefinir senha','<div class="g2"><label class="w2">Chave de recuperação<input name="k" required autocomplete="off"></label><label>Usuário<input name="login" required></label><label>Nova senha<input name="senha" type="password" required minlength="4"></label></div>',o=>{const k=o.k.toUpperCase().replace(/[^A-Z0-9]/g,'');if(hs('rk',k)!==db.rk)return'Chave de recuperação incorreta.';const u=db.users.find(x=>x.login===o.login.trim());if(!u)return'Usuário não encontrado.';u.senha=hs(u.login,o.senha);save();say('Senha redefinida. Entre com a nova senha.')})}
else if(a==='wipe')ask('Apagar todos os dados e recomeçar? Isso não pode ser desfeito.',()=>{dlg().close();db=def();save();me=null;draw()});
else if(a==='newkey')ask('Gerar uma nova chave de recuperação? A anterior deixa de valer.',()=>{const k=mk();db.rk=hs('rk',k);save();showKey(k)});else if(a==='login')doLogin();
else if(a==='yes'){$('#dlg2').close();const c=askCb;askCb=null;if(c)c()}else if(a==='no')$('#dlg2').close();
else if(a==='out'){me=null;draw()}
else if(a==='new')edit(k);else if(a==='ed')edit(k,id);else if(a==='del')del(k,id);
else if(a==='addf')$('#fls').insertAdjacentHTML('beforeend',filhoRow('',''));
else if(a==='rmf')t.parentNode.remove();
else if(a==='vc'){const c=db.cargos.find(x=>x.id===id),L=db.funcionarios.filter(x=>x.cargoId===id);info('Funcionários do cargo '+E(c.nome),L.length?tbl([{h:'Nome'},{h:'CPF'},{h:'Empresa'}],L.map(x=>`<tr><td>${E(x.nome)}</td><td>${E(x.cpf)}</td><td>${E(en(x.empresaId))}</td></tr>`)):'<div class="card empty">Nenhum funcionário neste cargo.</div>')}
else if(a==='mark')openForm('Registrar dia',`<div class="g2"><label>Data<input name="data" type="date" required></label><label>Situação<select name="tipo"><option>Normal</option><option>Falta</option><option>Falta justificada</option></select></label><label>Entrada<input name="e1" type="time"></label><label>Saída para o intervalo<input name="s1" type="time"></label><label>Retorno do intervalo<input name="e2" type="time"></label><label>Saída<input name="s2" type="time"></label></div>`,o=>{if(db.ponto.some(p=>p.fid===ui.ff&&p.data===o.data))return'Já existe um registro para este dia. Use “Ajustar” para corrigir.';o.id=U();o.fid=ui.ff;db.ponto.push(o);save()});
else if(a==='adj'){const p=db.ponto.find(x=>x.id===id),v=p.aj||p;openForm('Ajustar marcação',`<p class="sub">Os horários originais continuam guardados.</p><div class="g2"><label>Entrada<input name="e1" type="time" value="${v.e1||''}"></label><label>Saída para o intervalo<input name="s1" type="time" value="${v.s1||''}"></label><label>Retorno do intervalo<input name="e2" type="time" value="${v.e2||''}"></label><label>Saída<input name="s2" type="time" value="${v.s2||''}"></label><label class="w2">Motivo do ajuste<input name="motivo" required></label></div>`,o=>{o.por=me.nome;o.em=new Date().toISOString().slice(0,10);p.aj=o;save()})}
else if(a==='addo'){ui.lc.out.push({rid:'',v:''});draw()}
else if(a==='rmo'){ui.lc.out.splice(+t.dataset.i,1);draw()}
else if(a==='sv'){saveFolha(f);draw()}
else if(a==='conf'){saveFolha(f,'Conferida',{conf:me.nome});draw()}
else if(a==='fech'){saveFolha(f,'Fechada',{fech:me.nome});draw()}
else if(a==='reab'){ask('Reabrir esta folha para edição?',()=>{sv.status='Rascunho';save();draw()})}
else if(a==='open'){const x=db.folhas.find(y=>y.id===id);ui.ff=x.fid;ui.fc=x.comp;ui.lk='';draw()}
else if(a==='cc'){const x=db.folhas.find(y=>y.id===id);$('#frm').innerHTML=cc(x)+'<div class="acts noprint"><button type="button" class="btn g" data-a="x">Fechar</button><button type="button" class="btn" data-a="prt">Imprimir</button></div>';onSave=null;document.body.classList.add('pc');dlg().showModal()}
else if(a==='prt')window.print();
else if(a==='fcomp'){const L=db.folhas.filter(x=>x.emp===ui.fe&&x.comp===ui.fc);if(!L.length){say('Não há folhas salvas para esta empresa e competência.');return}
if(L.some(x=>x.status==='Rascunho')){say('Há folhas em rascunho. Confira todas antes de fechar a competência.');return}
ask('Fechar todas as folhas conferidas desta competência?',()=>{L.forEach(x=>{if(x.status==='Conferida'){x.status='Fechada';x.fech=me.nome}});save();draw()})}
else if(a==='exp'){const b=new Blob([JSON.stringify(db)],{type:'application/json'}),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='backup-folha.json';l.click()}
else if(a==='imp')$('#impf').click()});
document.addEventListener('input',e=>{const i=e.target.id;if(i==='q'){ui.q=e.target.value;draw()}
else if(i==='tol'||i==='lim'){db.cfg[i]=N(e.target.value);save()}
else if(i==='fs'){const v=e.target.value.toLowerCase().trim(),f=db.funcionarios.find(x=>x.empresaId===ui.fe&&((x.nome+' — '+x.cpf).toLowerCase()===v||dig(x.cpf)===dig(v)&&dig(v)||x.nome.toLowerCase()===v));if(f){ui.ff=f.id;ui.lk='';draw()}}
else if(e.target.dataset.lc){const k=e.target.dataset.lc;ui.lc[k]=k==='dec'?e.target.value:N(e.target.value);upd()}
else if(e.target.dataset.lo){ui.lc.out[+e.target.dataset.i][e.target.dataset.lo]=e.target.value;upd()}});
document.addEventListener('change',e=>{const t=e.target,i=t.id;
if(i==='fe'){ui.fe=t.value;ui.ff='';ui.lk='';draw()}else if(i==='ff'){ui.ff=t.value;ui.lk='';draw()}else if(i==='fc'&&t.value){ui.fc=t.value;ui.lk='';draw()}
else if(i==='qc'){ui.qc=t.value;draw()}
else if(i==='impf'){const fl=t.files[0];if(!fl)return;const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o.users||!o.empresas)throw 0;ask('Substituir todos os dados atuais pelos dados do arquivo?',()=>{db=Object.assign(def(),o);save();me=db.users.find(u=>u.id===me.id)||null;draw()})}catch(x){say('Arquivo inválido.')}};rd.readAsText(fl)}
else if(t.dataset.lc){const k=t.dataset.lc;ui.lc[k]=k==='dec'?t.value:N(t.value);upd()}
else if(t.dataset.lo){const o=ui.lc.out[+t.dataset.i];o[t.dataset.lo]=t.value;upd()}
else if(t.dataset.inss){const p=t.dataset.inss.split(':');db.cfg.inss[+p[0]][+p[1]]=N(t.value);save()}});
draw();
</script>
</body>
</html>
